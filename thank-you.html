<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request received | First Place Finish Mobile Detailing</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(circle at 50% 0%,rgba(232,182,76,.18),transparent 55%),#0a0a0b;color:#f4efe4;font-family:"Manrope",system-ui,sans-serif;text-align:center}
    body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:22px;background:conic-gradient(#f4efe4 25%,#0a0a0b 0 50%,#f4efe4 0 75%,#0a0a0b 0) 0 0/22px 22px;opacity:.9}
    main{max-width:640px;display:grid;justify-items:center;gap:1.2rem}
    .ico{width:80px;height:80px}
    h1{margin:0;font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:clamp(3.4rem,13vw,6rem);line-height:.88;text-transform:uppercase}
    h1 span{background:linear-gradient(100deg,#b5812a,#f2cf74 30%,#fff4cf 46%,#f0c461 58%,#a87420);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{margin:0;color:rgba(244,239,228,.72);font-size:1.08rem;line-height:1.7}
    .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
    a.btn{display:inline-flex;align-items:center;min-height:3.3rem;padding:0 1.6rem;border-radius:999px;background:#e8b64c;color:#111113;font-weight:800;text-decoration:none}
    a.btn--line{background:transparent;color:#f4efe4;box-shadow:inset 0 0 0 1px rgba(244,239,228,.35)}
    a:focus-visible{outline:2px solid #e8b64c;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#18181b"/><circle cx="16" cy="16" r="12" fill="#e8b64c"/><path d="M14.3 11.4l3-1.8h1.5V23h-3V13.5l-1.5.9z" fill="#0a0a0b"/></svg>
    <h1>Request <span>received.</span></h1>
    <p>Thanks for reaching out. Your detail isn't scheduled yet. We'll contact you soon to go over the details and confirm a time.</p>
    <div class="row">
      <a class="btn" href="/">Back to home</a>
      <a class="btn btn--line" href="tel:+17027550523">Call (702) 755-0523</a>
    </div>
  </main>
</body>
</html>
